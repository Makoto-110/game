<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野菜マージゲーム</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #eef7f1;
  text-align: center;
}

h1 {
  margin: 10px;
}

canvas {
  background: #fff;
  border: 3px solid #4caf50;
  border-radius: 10px;
}
</style>
</head>
<body>
<h1>🥬 野菜マージゲーム</h1>
<p>クリックで野菜を落とす！同じ野菜がぶつかると進化する！</p>
<canvas id="game" width="300" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const vegetables = [
  "もやし", "にんじん", "トマト", "なす", "キャベツ", "かぼちゃ"
];

let objects = [];
let gravity = 0.5;

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  spawnVegetable(x);
});

function spawnVegetable(x) {
  objects.push({
    x: x,
    y: 0,
    radius: 20,
    type: 0,
    vy: 0
  });
}

function update() {
  for (let obj of objects) {
    obj.vy += gravity;
    obj.y += obj.vy;

    if (obj.y + obj.radius > canvas.height) {
      obj.y = canvas.height - obj.radius;
      obj.vy *= -0.3;
    }
  }

  // 衝突判定
  for (let i = 0; i < objects.length; i++) {
    for (let j = i + 1; j < objects.length; j++) {
      let a = objects[i];
      let b = objects[j];

      let dx = a.x - b.x;
      let dy = a.y - b.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < a.radius + b.radius) {
        if (a.type === b.type && a.type < vegetables.length - 1) {
          // 合体
          objects.splice(j, 1);
          objects.splice(i, 1);
          objects.push({
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2,
            radius: a.radius + 5,
            type: a.type + 1,
            vy: 0
          });
          return;
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let obj of objects) {
    ctx.beginPath();
    ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#8bc34a";
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(vegetables[obj.type], obj.x, obj.y);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
